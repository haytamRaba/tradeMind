name: CI Pipeline

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: postgresql+psycopg://trademind:trademind@localhost:5432/trademind_test

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run ruff (linting)
        run: ruff check app/ tests/ scripts/ frontend/

      - name: Run ruff (formatting check)
        run: ruff format --check app/ tests/ scripts/ frontend/

      - name: Run mypy (type checking)
        run: mypy app/ --ignore-missing-imports

  test-sqlite:
    name: Unit Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with SQLite
        run: |
          python -m pytest tests/ -v --tb=short -x

  test-postgres:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trademind_test
          POSTGRES_USER: trademind
          POSTGRES_PASSWORD: trademind
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trademind -d trademind_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U trademind -d trademind_test && break
            sleep 1
          done

      - name: Run Alembic migrations
        run: |
          alembic upgrade head
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run tests with PostgreSQL
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test-sqlite]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: trademind-api:test
          load: true

      - name: Build Streamlit image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.streamlit
          push: false
          tags: trademind-streamlit:test
          load: true

      - name: Test API container starts
        run: |
          docker run --rm -d --name trademind-api-test \
            -e DATABASE_URL=sqlite+aiosqlite:///test.db \
            -p 8000:8000 \
            trademind-api:test
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop trademind-api-test

      - name: Test docker-compose
        run: |
          docker-compose config --quiet
          docker-compose up -d --build
          sleep 30
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8501/_stcore/health || exit 1
          docker-compose down -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run bandit (Python security)
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit-report.json || true
          cat bandit-report.json

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -f json -o pip-audit-report.json || true
          cat pip-audit-report.json

      - name: Run trivy (container scanning)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'HIGH,CRITICAL'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test-postgres, docker-build, security-scan]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging (placeholder)
        run: |
          echo "Deploy to staging environment"
          # Add actual deployment steps here
          # e.g., kubectl apply, docker-compose on remote, etc.