version: "3.9"

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: trademind-postgres
    environment:
      POSTGRES_DB: trademind
      POSTGRES_USER: trademind
      POSTGRES_PASSWORD: trademind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trademind -d trademind"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trademind-network

  # FastAPI backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trademind-api
    environment:
      DATABASE_URL: postgresql+psycopg://trademind:trademind@postgres:5432/trademind
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - trademind-network

  # Streamlit frontend
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: trademind-streamlit
    environment:
      FASTAPI_BASE_URL: http://api:8000
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./frontend:/app/frontend
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    networks:
      - trademind-network

volumes:
  postgres_data:

networks:
  trademind-network:
    driver: bridge